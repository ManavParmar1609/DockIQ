name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dockiq
          POSTGRES_PASSWORD: dockiq
          POSTGRES_DB: dockiq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dockiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests (SQLite)
        run: uv run pytest
      - name: Tests (Postgres)
        run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql://dockiq:dockiq@localhost:5432/dockiq_test
      - name: Container builds
        run: docker build --tag dockiq-api .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint and format
        run: npm run lint && npm run format:check
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.example.invalid
